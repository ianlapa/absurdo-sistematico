<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <!-- Warm sand/beige background circle -->
    <circle cx="50" cy="50" r="48" fill="#eae6dd" />
    
    <!-- Deep brown figure representing contemplation/thought -->
    <!-- Head -->
    <circle cx="52.2" cy="20.5" r="13" fill="#4e3629" />
    
    <!-- Torso / Arched Back -->
    <path d="M 40 30 
             C 28 35, 18 45, 15 60
             C 12 75, 23 80, 29 80
             C 32 80, 32 75, 30 72
             C 24 72, 19 68, 22 58
             C 25 48, 32 40, 42 36
             Z" fill="#4e3629" />
             
    <!-- Arm (vertical pill wrapping) -->
    <rect x="27.5" y="33" width="11" height="43" rx="5.5" fill="#4e3629" stroke="#eae6dd" stroke-width="1.8" />
    
    <!-- Bent Leg -->
    <path d="M 38 78
             L 58 59
             C 60 57, 63 57, 65 59
             L 83 75
             C 86 78, 83 83, 79 81
             L 60 66
             L 38 78
             Z" fill="#4e3629" />
</svg>
